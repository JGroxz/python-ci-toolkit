[styles]

# Fixed xterm-256 palette; avoid theme-controlled indices 0-15.
# black=16, red=160, green=40, yellow=184, blue=75, cyan=44,
# white=254, PyCI green=113

# rich_click
option = bold color(44)
argument = bold color(44)
switch = bold color(40)
metavar = bold color(184)
metavar_sep = dim
usage = color(184)

# Rich logging
logging.keyword = color(184)
logging.level.notset = dim
logging.level.debug = color(245) dim
logging.level.info = color(75)
logging.level.warning = color(184)
logging.level.error = color(160)
logging.level.critical = color(254) on color(160)

# CI Toolkit
pyci.info = color(75)
pyci.success = color(40)
pyci.error = color(160)
pyci.critical = color(16) on color(160)
pyci.flair = color(113)
pyci.flair_inverted = color(16) on color(113)
pyci.flair_dark = color(113)
pyci.flair_dark_dim = color(113) dim
pyci.action = color(40)
pyci.lifecycle = color(113)
pyci.metadata = color(75)
pyci.status.success = color(40)
pyci.status.failure = color(160)
pyci.duration = dim
pyci.query = color(184)
pyci.highlight = color(184) underline
pyci.command = color(184)
pyci.progress = color(113)
pyci.log.debug = dim
pyci.log.info = color(75)
pyci.log.warning = color(184)
pyci.log.error = color(160)
pyci.log.critical = color(254) on color(160)
pyci.log.critical_padding = color(160)
pyci.log.stdout = dim
pyci.log.stderr = dim

# Regex to search for Rich markup style tags: ["'].*\[[a-z\.]*\]
