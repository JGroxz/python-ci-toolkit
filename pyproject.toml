[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "python-ci-toolkit"
version = "0.32.0-dev"
description = "A collection of tools for building CI Python scripts used by PyCI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "PyCI", email = "hello@pyci.dev" },
]
dependencies = [
    "GitPython>=3.1",
    "rich>=1",
    "rich-click>=1.6.0,<2.0.0",
    "semver>=2",
    "toml>=0.10",
]

[project.scripts]
python-ci = "python_ci_toolkit.cli:cli"
pyci = "python_ci_toolkit.cli.action:action"

[dependency-groups]
dev = [
    "pytest>=7.2.1,<8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python_ci_toolkit"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(asctime)s,%(msecs)03d] %(name)-40.40s %(levelname)s %(message)s"
addopts = "--color=yes"
