[tool.poetry]
name = "python-ci-utilities"
version = "0.1.1"
description = "A collection of tools for building CI Python scripts used by PyCI"
authors = ["PyCI <hello@pyci.dev>"]

[tool.poetry.dependencies]
python = "^3.8"
rich = ">=1"
semver = ">=2"
toml = ">=0.10"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
