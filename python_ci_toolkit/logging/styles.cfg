[styles]

# rich_click
option = bold cyan
argument = bold cyan
switch = bold green
metavar = bold yellow
metavar_sep = dim
usage = yellow

# CI Toolkit
pyci.info = blue
pyci.success = green
pyci.error = red
pyci.critical = black on red
pyci.flair = rgb(146,202,85)
pyci.flair_inverted = black on rgb(146,202,85)
pyci.flair_dark = rgb(146,202,85)
pyci.action = green
pyci.query = yellow
pyci.highlight = yellow underline
pyci.command = yellow
pyci.progress = red

# Regex to search for Rich markup style tags: ["'].*\[[a-z\.]*\]