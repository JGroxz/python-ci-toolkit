name: "Build and test with Python"
run-name: "Building and testing on '${{ github.head_ref || github.ref }}'"

on:
  workflow_dispatch:
  pull_request:

jobs:

  build-and-test-python:
    name: Build and test with Python
    uses: pyci/.github-private/.github/workflows/run-python-tests.yml@main
    secrets: inherit
    permissions:
      contents: read
      checks: write
    with:
      python-version: ${{ vars.PYTHON_VERSION }}
